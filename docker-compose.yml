version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: outbox-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: outbox-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=outbox_super_secret_jwt_key_2026
      - WORKER_CONCURRENCY=5
      - RATE_LIMIT_MAX=5
      - RATE_LIMIT_DURATION_MS=1000
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: outbox-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  redis_data:
